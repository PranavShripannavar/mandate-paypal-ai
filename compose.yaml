services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mandate_test
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mandate_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  mandate_pg:
